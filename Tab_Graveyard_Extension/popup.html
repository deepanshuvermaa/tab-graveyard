<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; width: 400px; max-height: 520px; background: #fff; color: #1a1a2e; font-size: 13px; overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 14px 16px 10px; border-bottom: 1px solid #f0f0f0; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 24px; height: 24px; background: #1a1a2e; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2; }
    .logo span { font-weight: 600; font-size: 14px; }
    .actions { display: flex; gap: 6px; }
    .actions button { background: none; border: 1px solid #e5e5e5; border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 11px; font-family: inherit; color: #666; transition: all .15s; }
    .actions button:hover { border-color: #1a1a2e; color: #1a1a2e; }
    .search { width: 100%; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-family: inherit; outline: none; transition: border .15s; }
    .search:focus { border-color: #1a1a2e; }
    .tabs-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .group-label { padding: 6px 16px; font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: .04em; }
    .tab-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; transition: background .1s; }
    .tab-item:hover { background: #f8f8f8; }
    .tab-favicon { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }
    .tab-info { flex: 1; min-width: 0; }
    .tab-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-url { font-size: 10px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-time { font-size: 10px; color: #bbb; white-space: nowrap; }
    .tab-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; }
    .tab-del:hover { color: #e53e3e; background: #fff5f5; }
    .empty { text-align: center; padding: 40px 20px; color: #999; }
    .empty p { font-size: 12px; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-top: 1px solid #f0f0f0; }
    .pagination button { background: none; border: 1px solid #e5e5e5; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination button:not(:disabled):hover { border-color: #1a1a2e; }
    .pagination span { font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round"/></svg></div>
        <span>Tab Graveyard</span>
      </div>
      <div class="actions">
        <button id="exportBtn" title="Export JSON">Export</button>
        <button id="restoreAllBtn" title="Restore today's tabs">Restore Today</button>
        <button id="settingsBtn" title="Settings">⚙</button>
      </div>
    </div>
    <input type="text" class="search" id="searchInput" placeholder="Search closed tabs...">
  </div>
  <div class="tabs-list" id="tabsList"></div>
  <div class="pagination" id="pagination"></div>
  <script src="popup.js"></script>
</body>
</html>
