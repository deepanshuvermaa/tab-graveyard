<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Graveyard — Settings</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #1a1a2e; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #888; margin-bottom: 24px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 6px; }
    input[type="number"] { width: 100%; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none; }
    input:focus { border-color: #1a1a2e; }
    .hint { font-size: 11px; color: #aaa; margin-top: 4px; }
    button { background: #1a1a2e; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer; margin-top: 8px; }
    button:hover { background: #2d2d4e; }
    .saved { display: inline-block; margin-left: 12px; font-size: 12px; color: #10b981; opacity: 0; transition: opacity .3s; }
    .saved.show { opacity: 1; }
    .danger { margin-top: 32px; padding-top: 20px; border-top: 1px solid #f0f0f0; }
    .danger button { background: #fff; color: #e53e3e; border: 1px solid #fecaca; }
    .danger button:hover { background: #fef2f2; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <p class="sub">Configure Tab Graveyard behavior.</p>

  <div class="field">
    <label>Max history size</label>
    <input type="number" id="maxHistory" min="50" max="2000" value="500">
    <div class="hint">Maximum closed tabs to store (50–2000). Oldest removed first.</div>
  </div>

  <div class="field">
    <label>Auto-purge after (days)</label>
    <input type="number" id="autoPurge" min="0" max="365" value="0">
    <div class="hint">Set to 0 to disable. Tabs older than this are auto-deleted.</div>
  </div>

  <button id="saveBtn">Save Settings</button>
  <span class="saved" id="savedMsg">✓ Saved</span>

  <div class="danger">
    <label>Danger Zone</label>
    <button id="clearBtn">Clear All History</button>
  </div>

  <script>
    chrome.storage.local.get(['settings'], (r) => {
      const s = r.settings || {};
      document.getElementById('maxHistory').value = s.maxHistory || 500;
      document.getElementById('autoPurge').value = s.autoPurgeDays || 0;
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const settings = {
        maxHistory: parseInt(document.getElementById('maxHistory').value) || 500,
        autoPurgeDays: parseInt(document.getElementById('autoPurge').value) || 0,
      };
      chrome.storage.local.set({ settings }, () => {
        const msg = document.getElementById('savedMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2000);
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Delete all closed tab history?')) {
        chrome.storage.local.set({ closedTabs: [] });
      }
    });
  </script>
</body>
</html>
